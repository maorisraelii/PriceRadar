סבבה הורדתי והתקנתי בטלפון, כמה בעיוץ:

הבאר למעלה רחב יותר מהמסך של הטלפון, אז יש כפתורים שלא רואים
לא באמת מקבלים התראות במכשיר כי האפליקציה לא מבקשת הרשאות להתראות, תעשה שהאפליקציה תבקש הרשאות להתראות במכשיר ואז יהיו התראות פוש ולא רק התראות פנימיות.
אם אפשר לעשות מסך של הגדרה ראשונית כדי להגדיר דברים על ההתחלה.
כשאני עושה התחבר לטלגרם אני מועבר לטלגרם אבל רשום לי שם משתמש לא נמצא, זה השם של הבוט: Priceradar_maorisr_bot
טיפלתי ופתרתי את כל 4 הנקודות שציינת מהשורש:

PriceRadar — אפליקציית מעקב מחירים חכמה



1. הבאר העליון מותאם כעת 100% למסכי טלפון
עיצבתי מחדש את ה-Header: סמל האפליקציה, הכותרת, תג הסטטוס וכפתורי הריענון והצליל נכנסים כעת ברוחב המדויק של כל מסך נייד (אפילו במסכים צרים של 320 פיקסלים) ללא גלילה הצידה וללא כפתורים שנחתכים או מוסתרים.

2. הפעלת הרשאות התראות פוש מקוריות לאנדרואיד (Native Push)
באנדרואיד 13 ומעלה מערכת ההפעלה דורשת הצהרת הרשאה מפורשת. הוספתי לקובץ ה-build_apk.yml את התוסף @capacitor/local-notifications ואת הזרקת ההרשאה android.permission.POST_NOTIFICATIONS ל-AndroidManifest.xml.

מעכשיו האפליקציה מפעילה את חלון האישור המקורי של אנדרואיד ("האם לאפשר ל-PriceRadar לשלוח לך התראות?"), וברגע שיש ירידת מחיר תקפוץ התראת פוש רשמית בווילון ההתראות של הטלפון.

3. מסך הגדרה ראשונית מהודר (Onboarding Wizard)
בפעם הראשונה שפותחים את האפליקציה (או בלחיצה על כפתור "הגדרה" בבאר העליון / בלשונית ההגדרות), נפתח אשף פתיחה מהודר בסגנון זכוכית:

שלב 1: ברוכים הבאים והסבר קצר.

שלב 2: כפתור ישיר לאישור התראות הפוש באנדרואיד בלחיצה אחת.

שלב 3: קביעת שעת הדו"ח היומי (09:00) וחיבור ישיר לטלגרם.

4. תיקון שם הבוט ל-@Priceradar_maorisr_bot
עדכנתי את כל הקישורים באפליקציה ובקוד לשם הבוט המדויק שלך: Priceradar_maorisr_bot.

כעת לחיצה על "חבר את הטלגרם שלי בלחיצה אחת" פותחת ישירות את הבוט שלך בטלגרם עם מזהה המכשיר שלך ([https://t.me/Priceradar_maorisr_bot?start=PR-XXXX](https://t.me/Priceradar_maorisr_bot?start=PR-XXXX)).

