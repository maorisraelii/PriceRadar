name: Build Android APK & Publish Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Calculate Dynamic App Version (+0.1 per build)
        id: versioning
        run: |
          RUN_NUM="${{ github.run_number }}"
          VERSION_NAME="1.${RUN_NUM}.0"
          VERSION_CODE=$((100 + RUN_NUM))
          TAG_NAME="v${VERSION_NAME}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "Calculated Dynamic Version: ${VERSION_NAME} (code: ${VERSION_CODE}, tag: ${TAG_NAME})"

      - name: Prepare Web Assets & Setup Android Project
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          npm install --no-audit --no-fund
          npx cap add android
          npx cap copy android
          python3 finalize_build.py

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Clean Release File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PriceRadar.apk

      - name: Publish Direct GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "PriceRadar ${{ env.TAG_NAME }} (Official Release)"
          body: "הורדה ישירה של גרסה ${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }}). הגרסה עולה אוטומטית ב-0.1 בכל הרצת בנייה ומאפשרת התקנה חלקה מעל גרסאות ישנות!"
          files: PriceRadar.apk
