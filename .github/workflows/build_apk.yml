רגע האפליקציה נותנת גם התראות פוש או רק בבוט?

היא תומכת בשניהם! בנינו את המערכת כך שתוכל לבחור או להשתמש בשניהם במקביל:

סוג ההתראה	איך זה מגיע לטלפון?	מתי זה עובד?
1. התראות פוש ישירות מהאפליקציה (Push Notifications)	התראה רגילה של אנדרואיד שקופצת בווילון ההתראות העליון של הטלפון (עם כותרת ירידת המחיר, אחוזי החיסכון וצליל).	מופעלת בלחיצה על "הפעל התראות" בהגדרות. עובדת כשהאפליקציה פתוחה או כשהיא ברקע.
2. התראות פוש דרך בוט הטלגרם	הודעת פוש מידית מטלגרם לטלפון עם תמונת המוצר, המחיר החדש וקישור ישיר לקנייה.	עובדת תמיד (24/7): גם אם הטלפון נעול שעות בכיס, גם אם סגרת לגמרי את האפליקציה (Kill App), ואפילו ממחשב או טאבלט אחר שמחוברים לטלגרם שלך.
למה השילוב הזה הוא הפתרון הכי מוצלח?
מערכת ההפעלה של אנדרואיד נוטה לעיתים "להרדים" אפליקציות עצמאיות שנשארות סגורות כדי לחסוך בסוללה. לעומת זאת, אפליקציית טלגרם פועלת תמיד ברקע של כל מכשיר אנדרואיד ללא הגבלת סוללה.

לכן:

ביום-יום: תקבל התראות פוש ישירות על המסך מהאפליקציה עצמה.

גיבוי 24/7 שלא מפספס כלום: בוט הטלגרם מוודא שגם אם הטלפון שלך היה כבוי, נעול או בלי סוללה לשעות – ברגע שיש ירידת מחיר או כשמגיעה שעת הדו"ח היומי (09:00), תקבל צלצול והודעה ישירה.

