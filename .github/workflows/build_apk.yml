name: Build Android APK & Publish Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Web Assets & Capacitor Configuration
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          
          cat << 'EOF' > package.json
          {
            "name": "priceradar-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0",
              "@capacitor/local-notifications": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.priceradar.app",
            "appName": "PriceRadar",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npm install --no-audit --no-fund
          npx cap add android
          npx cap copy android

          # הוספת הרשאות התראות פוש לאנדרואיד 13+ ב-AndroidManifest.xml
          python3 -c "
          import os
          p = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(p):
              m = open(p, 'r', encoding='utf-8').read()
              perms = '\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <uses-permission android:name=\"android.permission.VIBRATE\" />\n    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\" />\n'
              if 'POST_NOTIFICATIONS' not in m:
                  m = m.replace('</manifest>', perms + '</manifest>')
                  open(p, 'w', encoding='utf-8').write(m)
                  print('Added POST_NOTIFICATIONS to AndroidManifest.xml')
          "

      - name: Copy App Launcher Icons
        run: |
          python3 -c "
          import os, shutil
          for density in ['hdpi', 'mdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi']:
              folder = f'android/app/src/main/res/mipmap-{density}'
              os.makedirs(folder, exist_ok=True)
