name: Build Android APK & Publish Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 & Persistent Signing Keystore
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Persistent Android Signing Keystore across all builds
        run: |
          if [ -f "priceradar-signing.keystore" ]; then
            mkdir -p ~/.android
            cp priceradar-signing.keystore ~/.android/debug.keystore
            echo "Loaded persistent priceradar-signing.keystore -> ~/.android/debug.keystore"
          else
            mkdir -p ~/.android
            keytool -genkeypair -v -keystore priceradar-signing.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            cp priceradar-signing.keystore ~/.android/debug.keystore
            git config user.name "PriceRadar CI"
            git config user.email "ci@priceradar.app"
            git add priceradar-signing.keystore
            git commit -m "ci: Persist Android signing keystore so APK updates never require uninstall" || true
            git push origin HEAD:main || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract App Version & Release Notes from index.html
        id: versioning
        run: |
          RUN_NUM="${{ github.run_number }}"
          BASE_VER=$(grep -oP 'window\.__APP_VERSION__\s*=\s*"\K[^"]+' index.html || echo "3.0.1")
          export VERSION_NAME="${BASE_VER}"
          export VERSION_CODE=$((200 + RUN_NUM))
          export TAG_NAME="v${VERSION_NAME}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          python3 - << 'PYEOF'
          import os, re, subprocess
          ver = os.environ.get("VERSION_NAME", "3.0.1")
          code = os.environ.get("VERSION_CODE", "201")
          notes = ""
          if os.path.exists("index.html"):
              with open("index.html", "r", encoding="utf-8") as f:
                  m = re.search(r'window\.__OTA_RELEASE_NOTES__\s*=\s*"([^"]+)"', f.read())
                  if m:
                      notes = m.group(1)
          if not notes:
              notes = "שיפורי יציבות, זיהוי מחירים ותיקוני באגים."
          commit_msg = subprocess.check_output(["git", "log", "-1", "--pretty=%s"], text=True).strip()
          md = f"""## 🚀 מה חדש בגרסה v{ver} (Build {code})

          {notes}

          ### 📝 פירוט עדכון (Commit)
          - `{commit_msg}`

          ---
          📦 **הורדה ישירה:** הורד את הקובץ `PriceRadar.apk` המצורף למטה (ניתן להתקין ישירות מעל גרסה קיימת ללא מחיקת נתונים).
          """
          with open("release_notes.md", "w", encoding="utf-8") as out:
              out.write("\n".join(line.lstrip() for line in md.strip().splitlines()) + "\n")
          PYEOF
          echo "Synced Release Version from index.html: ${VERSION_NAME} (code: ${VERSION_CODE}, tag: ${TAG_NAME})"

      - name: Prepare Web Assets & Setup Android Project
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          npm install --no-audit --no-fund
          npx cap add android
          npx cap copy android
          python3 finalize_build.py

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Clean Release File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PriceRadar.apk

      - name: Publish Direct GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "PriceRadar ${{ env.TAG_NAME }}"
          body_path: release_notes.md
          files: PriceRadar.apk
