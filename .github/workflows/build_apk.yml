בשרתי ה-Ubuntu של GitHub Actions, כל ה-Android SDK כבר מותקן מראש כברירת מחדל, כך שלא צריך שום תוסף חיצוני עבורו – מספיקה פקודת אישור רישיונות פשוטה של שורה אחת (yes | sdkmanager --licenses || true).

הסרתי את התוסף התקול וייצבתי את הקובץ:

סמל של YML
build_apk
 YML 
עדכון מהיר ב-GitHub:
פתח במאגר שלך את הקובץ: .github/workflows/build_apk.yml ולחץ על סמל העיפרון ✏️.

החלף את כל תוכנו בקוד הנקי הבא:

YAML
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets & Capacitor Configuration
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          
          cat << 'EOF' > package.json
          {
            "name": "priceradar-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.priceradar.app",
            "appName": "PriceRadar",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npm install --no-audit --no-fund
          npx cap add android
          npx cap copy android

      - name: Copy App Launcher Icons
        run: |
          python3 -c "
          import os, shutil
          for density in ['hdpi', 'mdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi']:
              folder = f'android/app/src/main/res/mipmap-{density}'
              os.makedirs(folder, exist_ok=True)
              if os.path.exists('icon-512.png'):
                  shutil.copy('icon-512.png', f'{folder}/ic_launcher.png')
                  shutil.copy('icon-512.png', f'{folder}/ic_launcher_round.png')
          "

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PriceRadar-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
