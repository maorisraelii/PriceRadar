אוקיי זה עלה ויש וי, מה עכשיו?

מעולה! עכשיו יש לך קובץ APK מוכן להתקנה ישירות מ-GitHub. הנה איך להוריד ולהתקין אותו תוך דקה:

הורדת ה-APK מ-GitHub:

לחץ על השורה של הריצה שהסתיימה (איפה שמופיע ה-V הירוק ✅).

גלול לתחתית העמוד לאזור שנקרא Artifacts.

תראה שם קובץ להורדה בשם PriceRadar-Debug-APK – לחץ עליו והוא ירד כקובץ ZIP שמכיל את ה-app-debug.apk (או ישירות לטלפון).

התקנה בטלפון:

חלץ את ה-APK והעבר אותו לטלפון (או פתח אותו ישירות אם הורדת דרך הדפדפן בטלפון).

לחץ על הקובץ להתקנה. אם אנדרואיד מקפיץ הודעה על "התקנת אפליקציות ממקור לא מוכר" – אשר את ההתקנה.

האפליקציה תופיע על מסך הבית שלך עם האייקון המעוצב.

בדיקת השטח של האפליקציה:

פתח את האפליקציה בטלפון (תוכל לראות שבראש המסך מופיע ☁️ מסונכרן לענן 24/7).

הדבק את אחד הקישורים שבדקנו (למשל האוכל לארנב מ-MyRabbit, מכונת הגלידה מטרקלין או הנעליים מפוט לוקר), בחר וריאציה ולחץ שמור.

עבור ללשונית זמני התראה וטלגרם ולחץ על "חבר את הטלגרם שלי בלחיצה אחת" כדי לקבל הודעות מהבוט שלך.

ברגע שהמוצר שמור, שרת ה-GitHub Actions יבדוק אותו אוטומטית ברקע 24/7 ויעדכן אותך בכל ירידת מחיר!

אפשר להעביר את זה ישר לריליס או שחייב להוריד את זה כדי להעביר?

אפשר לחלוטין להפוך את זה ל-Release רשמי ב-GitHub כך שכל מי שנכנס למאגר יראה קישור ישיר להורדת PriceRadar.apk (במקום להיכנס ללשונית Actions).

יש לך שתי דרכים לעשות זאת:

אפשרות 1: להעביר עכשיו ב-30 שניות את הקובץ שכבר בנית
אם אתה לא רוצה להריץ בנייה מחדש:

לחץ על PriceRadar-Debug-APK בלשונית ה-Actions כדי להוריד אותו למחשב, וחלץ את קובץ ה-app-debug.apk (שנה את שמו ל-PriceRadar.apk).

עבור לדף הראשי של המאגר ב-GitHub (לשונית Code).

בצד ימין למטה תראה אזור שנקרא Releases – לחץ על Create a new release (או Draft a new release).

בחר תגית (למשל v1.0.0), רשום כותרת (למשל PriceRadar v1.0.0), וגרור את קובץ ה-PriceRadar.apk לתיבה המיועדת בתחתית.

לחץ על Publish release (הכפתור הירוק).

אפשרות 2: לתת ל-GitHub לעשות את זה אוטומטית בכל בנייה (הכי מומלץ)
