YAML
name: Build Android APK & Publish Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Web Assets & Capacitor Configuration
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          
          cat << 'EOF' > package.json
          {
            "name": "priceradar-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.priceradar.app",
            "appName": "PriceRadar",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npm install --no-audit --no-fund
          npx cap add android
          npx cap copy android

      - name: Copy App Launcher Icons
        run: |
          python3 -c "
          import os, shutil
          for density in ['hdpi', 'mdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi']:
              folder = f'android/app/src/main/res/mipmap-{density}'
              os.makedirs(folder, exist_ok=True)
              if os.path.exists('icon-512.png'):
                  shutil.copy('icon-512.png', f'{folder}/ic_launcher.png')
                  shutil.copy('icon-512.png', f'{folder}/ic_launcher_round.png')
          "

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Clean Release File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PriceRadar.apk

      - name: Publish Direct GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "PriceRadar v1.0.0 (Official Release)"
          body: "הורדה ישירה של קובץ האפליקציה הרשמי לאנדרואיד (PriceRadar.apk). פשוט להוריד ולהתקין!"
          files: PriceRadar.apk
